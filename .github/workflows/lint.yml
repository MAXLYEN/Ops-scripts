# 静态检查与端到端测试。检查内容都在 tests/ 里，本地用 tests/run.sh 跑的是同一份，
# 不在这里另写一套 —— 两处维护必然漂移。
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 语法、shellcheck、版本头、MANIFEST、菜单归类、配置键。只读，不执行任何脚本
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version | head -2
      - run: bash tests/lint.sh

  # 在 Debian 12 容器里跑 opsget 与 opsbox 的端到端测试，被调用的脚本用桩代替
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 要取旧 tag，测「固定在没有菜单的旧版本」
      - run: bash tests/run.sh --e2e
