# ops-scripts 环境配置模板
# VERSION: 1.1.0
# 1.1.0: DOMAINS 支持留空自动扫描 vhost（与 XBOARD_SITES 同一套约定）
#
# 复制到 /etc/ops-scripts/env.conf 并填写，权限设为 600：
#   install -d -m 700 /etc/ops-scripts
#   install -m 600 env.example.conf /etc/ops-scripts/env.conf
#
# 本文件是 shell 片段，会被 source。值里有空格就加引号。
# 留空或删掉的项，用到它的脚本会直接报错退出 —— 这是刻意的。

# ── 主机标识 ────────────────────────────────────────────────
# 迁移场景下：OLD 是迁出机，NEW 是迁入机。非迁移场景只填 NEW 即可。
OLD_HOST_IP=""              # 迁出机公网 IP
OLD_SSH_PORT=""             # 迁出机 SSH 端口
NEW_HOST_IP=""              # 迁入机公网 IP（NAT 环境下填公网出口，不是网卡地址）
NEW_SSH_PORT=""             # 迁入机 SSH 端口

# ── 对外服务的域名 ──────────────────────────────────────────
# 空格分隔。用于 --resolve 预演、证书对账、切换后验收。
#
# **推荐留空** —— 留空时自动从 PANEL_VHOST_DIR 的 server_name 扫描，
# 面板上增删域名不用再同步改这里。
# 显式填写时脚本会与 vhost 双向比对：多出的（站点已删）和漏掉的
# （新站点没列进来，会被静默跳过检查）都会告警。
DOMAINS=""

# ── 需要验证入站可达的端口 ──────────────────────────────────
# 空格分隔。至少包含 80 443 和 SSH 端口、面板端口。
PROBE_PORTS="80 443"

# ── 容器 ────────────────────────────────────────────────────
# docker run 起的容器名，空格分隔
RUN_CONTAINERS=""
# compose 项目目录，空格分隔（每个目录下应有 compose.yaml）
COMPOSE_DIRS=""
# 容器数据所在的宿主机目录，空格分隔（会被打进快照）
CONTAINER_DATA_DIRS=""

# ── 数据库 ──────────────────────────────────────────────────
DB_NAMES=""                             # 空格分隔的业务库名
MYSQL_DEFAULTS_FILE="/root/.my.cnf"     # root 凭据文件，600
# 容器访问宿主机数据库时，账号应当使用的 host 通配
DB_CLIENT_HOST="172.%"
# 防火墙放行给容器的网段（Docker 默认池是 172.17~172.31）
DOCKER_CIDR="172.16.0.0/12"
# 容器内访问宿主机的地址（docker0 网关）
DOCKER_GATEWAY="172.17.0.1"

# ── 备份 ────────────────────────────────────────────────────
BACKUP_DIRS=""                          # 本地备份落盘目录，空格分隔
BACKUP_PASS_FILES=""                    # 备份加密密码文件，空格分隔，均需 600
RCLONE_REMOTES=""                       # 空格分隔，如 "remote1 remote2"
RCLONE_PATHS=""                         # 空格分隔的云端目录名
BACKUP_SCRIPTS=""                       # 备份脚本名，空格分隔（位于 /usr/local/bin）
MAIL_TO=""                              # 告警收件地址
# 邮件发不出去时的两条后路。webhook 留空则跳过；落盘文件总会写。
ALERT_WEBHOOK=""                        # Server酱 / TG Bot 等，POST 一个 text 字段
ALERT_FALLBACK_FILE="/var/log/backup-alerts.log"

# ── 反向监控（dead man's switch）─────────────────────────────
# 正向告警盖不住「脚本压根没跑」——宕机、cron 挂掉、crontab 被面板重写，
# 这三种情况一封邮件都不会有，而「没收到邮件」看起来和「一切正常」一模一样。
# 心跳交给**机器之外**的观察者：约定时间没收到，由它来告警。
# 每个脚本一个独立 URL；留空则整个机制跳过，脚本行为不变。
# ⚠️ 这两个 URL 等同凭据（拿到就能伪造心跳），只放这里，不要进仓库。
VW_HEARTBEAT_URL=""
XBOARD_HEARTBEAT_URL=""

# ── 面板路径 ────────────────────────────────────────────────
# 不同面板/版本路径不同，按实际填写；不用面板就留空，相关检查会跳过。
PANEL_ROOT="/www/server/panel"
PANEL_VHOST_DIR="${PANEL_ROOT}/vhost/nginx"
PANEL_CERT_DIR="${PANEL_ROOT}/vhost/cert"
PANEL_DB_DIR="${PANEL_ROOT}/data/db"
# 面板的 cron 脚本目录 —— 注意它常常**不在** PANEL_ROOT 下面！
# 用 crontab -l 看任务的实际路径再填，填错会让证书审计的"续期任务"一节静默为空
PANEL_CRON_DIR="/www/server/cron"
WWWROOT="/www/wwwroot"
WWWLOGS="/www/wwwlogs"
# 面板的数据库备份任务输出目录（备份脚本会从这里取大库的 dump）
PANEL_DB_BACKUP_DIR=""

# ── 快照 ────────────────────────────────────────────────────
SNAPSHOT_ROOT=""                        # 冷快照落盘的父目录
# 除容器数据外还要收进快照的路径，空格分隔。
# 提示：凭据文件极易漏，把每一个都列进来。
EXTRA_SNAPSHOT_PATHS="/usr/local/bin /etc/msmtprc /root/.config/rclone /etc/sysctl.d /etc/ufw"

# ── 备份脚本专用（backup/ 下两个脚本会读）───────────────────
BACKUP_KEEP_LOCAL_DAYS=180
BACKUP_KEEP_CLOUD_DAYS=400

# 各服务的数据目录。用不到的服务留空，脚本会跳过并告警而不是中止。
SVC_VW_DIR=""                       # Vaultwarden 目录（含 data/ 与 vaultwarden.env）
SVC_KOMARI_DATA=""                  # Komari 的 /app/data 挂载源，komari.db 在这里
SVC_KOMARI_EXTRA=""                 # Komari 的 auto-discovery.json 所在目录
SVC_SUBCONV_DIR=""                  # SubConverter 目录
SVC_XBOARD_DIR=""                   # Xboard 目录（含 .env）

# backup/vw-fullbackup
VW_BACKUP_DIR=""                    # 本地落盘目录
VW_REMOTE_PATH=""                   # 云端目录名，与 RCLONE_REMOTES 组合成完整路径
VW_PASS_FILE=""                     # 备份加密密码文件，600
VW_LOG_FILE="/var/log/vw-fullbackup.log"

# backup/xboard-fullbackup
XBOARD_BACKUP_DIR=""
XBOARD_REMOTE_PATH=""
XBOARD_DB_NAME="xboard"
XBOARD_DB_USER="xboard"
XBOARD_DB_HOST="127.0.0.1"
XBOARD_DB_PORT="3306"
XBOARD_DB_PASS_FILE=""              # 数据库密码文件，600 —— 极易在换机器时漏收
# 站点域名列表。**留空 = 自动模式**：扫 vhost 目录把所有站点都收进来，
# 面板里增删域名不用回来改这里。填了则按列表严格检查，缺了会告警。
XBOARD_SITES=""
XBOARD_ASSETS_SITE=""               # 静态资源站域名，留空则取 XBOARD_SITES 最后一个
XBOARD_EXCLUDE_TABLES=""            # 空格分隔，只排除数据、结构仍会导出
XBOARD_MAIL_PREFIX="[Xboard备份]"

# ops/komari-metrics-check
METRICS_DB_NAME="metrics"
METRICS_RETENTION_DAYS=30

# ── 面板自带的整机备份包（ops/panel-backup-upload 会读）─────
# 面板「备份恢复」功能产生的 tar.gz 落盘目录，以及上传到网盘的目标目录名
PANEL_BACKUP_DIR="/www/backup/backup_restore"
PANEL_BACKUP_REMOTE_PATH="BTBackup-AllServer"

# ── 服务端口段（init/02 与 init/03 会读）────────────────────
# 留空则用脚本内置默认值。填了就以这里为准，端口规划只在一处维护。
SVC_TCP_RANGES="80 443 10000:11000 50000:60000"
SVC_UDP_RANGES="443 50000:60000"

# ── 杂项 ────────────────────────────────────────────────────
TZ_EXPECTED="UTC"                       # 期望的系统时区

# ── 迁移专用（07 / 09 用到） ────────────────────────────────
# 恢复后必须存在的关键文件，逐条列出。这些是"丢了就回不来"的东西：
# 加密密钥、应用 KEY、token 数据库、被覆盖会触发重新初始化的配置。
CRITICAL_FILES=""
RESTORE_STAGE="/root/restore_stage"     # 快照解包的暂存目录
RESTORE_CMD_DIR="/root/restore_cmds"    # 生成的 docker run 命令落盘处
IMAGE_EXPORT_DIR=""                     # 镜像导出目录，留空则用 SNAPSHOT_ROOT/images
BACKUP_DEPS="rclone p7zip-full rsync msmtp msmtp-mta sqlite3"
# 库名与账号名不一致时填这里，空格分隔；留空则沿用 DB_NAMES
DB_USERS=""
# 迁移后可能出现的错误 host，修正时会从这些值改成 DB_CLIENT_HOST
WRONG_HOSTS="127.0.0.1 %"
