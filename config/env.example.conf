# ops-scripts 环境配置模板
# VERSION: 1.0.0
#
# 复制到 /etc/ops-scripts/env.conf 并填写，权限设为 600：
#   install -d -m 700 /etc/ops-scripts
#   install -m 600 env.example.conf /etc/ops-scripts/env.conf
#
# 本文件是 shell 片段，会被 source。值里有空格就加引号。
# 留空或删掉的项，用到它的脚本会直接报错退出 —— 这是刻意的。

# ── 主机标识 ────────────────────────────────────────────────
# 迁移场景下：OLD 是迁出机，NEW 是迁入机。非迁移场景只填 NEW 即可。
OLD_HOST_IP=""              # 迁出机公网 IP
OLD_SSH_PORT=""             # 迁出机 SSH 端口
NEW_HOST_IP=""              # 迁入机公网 IP（NAT 环境下填公网出口，不是网卡地址）
NEW_SSH_PORT=""             # 迁入机 SSH 端口

# ── 对外服务的域名 ──────────────────────────────────────────
# 空格分隔。用于 --resolve 预演、证书对账、切换后验收。
DOMAINS=""

# ── 需要验证入站可达的端口 ──────────────────────────────────
# 空格分隔。至少包含 80 443 和 SSH 端口、面板端口。
PROBE_PORTS="80 443"

# ── 容器 ────────────────────────────────────────────────────
# docker run 起的容器名，空格分隔
RUN_CONTAINERS=""
# compose 项目目录，空格分隔（每个目录下应有 compose.yaml）
COMPOSE_DIRS=""
# 容器数据所在的宿主机目录，空格分隔（会被打进快照）
CONTAINER_DATA_DIRS=""

# ── 数据库 ──────────────────────────────────────────────────
DB_NAMES=""                             # 空格分隔的业务库名
MYSQL_DEFAULTS_FILE="/root/.my.cnf"     # root 凭据文件，600
# 容器访问宿主机数据库时，账号应当使用的 host 通配
DB_CLIENT_HOST="172.%"
# 防火墙放行给容器的网段（Docker 默认池是 172.17~172.31）
DOCKER_CIDR="172.16.0.0/12"
# 容器内访问宿主机的地址（docker0 网关）
DOCKER_GATEWAY="172.17.0.1"

# ── 备份 ────────────────────────────────────────────────────
BACKUP_DIRS=""                          # 本地备份落盘目录，空格分隔
BACKUP_PASS_FILES=""                    # 备份加密密码文件，空格分隔，均需 600
RCLONE_REMOTES=""                       # 空格分隔，如 "remote1 remote2"
RCLONE_PATHS=""                         # 空格分隔的云端目录名
BACKUP_SCRIPTS=""                       # 备份脚本名，空格分隔（位于 /usr/local/bin）
MAIL_TO=""                              # 告警收件地址

# ── 面板路径 ────────────────────────────────────────────────
# 不同面板/版本路径不同，按实际填写；不用面板就留空，相关检查会跳过。
PANEL_ROOT="/www/server/panel"
PANEL_VHOST_DIR="${PANEL_ROOT}/vhost/nginx"
PANEL_CERT_DIR="${PANEL_ROOT}/vhost/cert"
PANEL_DB_DIR="${PANEL_ROOT}/data/db"
PANEL_CRON_DIR="${PANEL_ROOT}/cron"
WWWROOT="/www/wwwroot"
WWWLOGS="/www/wwwlogs"
# 面板的数据库备份任务输出目录（备份脚本会从这里取大库的 dump）
PANEL_DB_BACKUP_DIR=""

# ── 快照 ────────────────────────────────────────────────────
SNAPSHOT_ROOT=""                        # 冷快照落盘的父目录
# 除容器数据外还要收进快照的路径，空格分隔。
# 提示：凭据文件极易漏，把每一个都列进来。
EXTRA_SNAPSHOT_PATHS="/usr/local/bin /etc/msmtprc /root/.config/rclone /etc/sysctl.d /etc/ufw"

# ── 杂项 ────────────────────────────────────────────────────
TZ_EXPECTED="UTC"                       # 期望的系统时区

# ── 迁移专用（07 / 09 用到） ────────────────────────────────
# 恢复后必须存在的关键文件，逐条列出。这些是"丢了就回不来"的东西：
# 加密密钥、应用 KEY、token 数据库、被覆盖会触发重新初始化的配置。
CRITICAL_FILES=""
RESTORE_STAGE="/root/restore_stage"     # 快照解包的暂存目录
RESTORE_CMD_DIR="/root/restore_cmds"    # 生成的 docker run 命令落盘处
IMAGE_EXPORT_DIR=""                     # 镜像导出目录，留空则用 SNAPSHOT_ROOT/images
BACKUP_DEPS="rclone p7zip-full rsync msmtp msmtp-mta sqlite3"
# 库名与账号名不一致时填这里，空格分隔；留空则沿用 DB_NAMES
DB_USERS=""
# 迁移后可能出现的错误 host，修正时会从这些值改成 DB_CLIENT_HOST
WRONG_HOSTS="127.0.0.1 %"
